name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release ${{ matrix.os }} (${{ matrix.artifact_prefix }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux x64
          - os: ubuntu-latest
            go_os: linux
            go_arch: amd64
            rust_target: x86_64-unknown-linux-gnu
            binary_ext: ''
            static_lib_name: 'librsil.a'
            static_lib_artifact: 'librsil-linux-amd64.a'
            artifact_prefix: linux-amd64
          # macOS Apple Silicon (M1/M2/M3)
          - os: macos-latest
            go_os: darwin
            go_arch: arm64
            rust_target: aarch64-apple-darwin
            binary_ext: ''
            static_lib_name: 'librsil.a'
            static_lib_artifact: 'librsil-darwin-arm64.a'
            artifact_prefix: darwin-arm64
          # macOS Intel
          - os: macos-13
            go_os: darwin
            go_arch: amd64
            rust_target: x86_64-apple-darwin
            binary_ext: ''
            static_lib_name: 'librsil.a'
            static_lib_artifact: 'librsil-darwin-amd64.a'
            artifact_prefix: darwin-amd64
          # Windows x64
          - os: windows-latest
            go_os: windows
            go_arch: amd64
            rust_target: x86_64-pc-windows-msvc
            binary_ext: .exe
            static_lib_name: 'rsil.lib'
            static_lib_artifact: 'rsil-windows-amd64.lib'
            artifact_prefix: windows-amd64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Build Go Binary (sil)
        env:
          GOOS: ${{ matrix.go_os }}
          GOARCH: ${{ matrix.go_arch }}
        run: |
          go build -o sil-${{ matrix.artifact_prefix }}${{ matrix.binary_ext }} cmd/sil/main.go
        shell: bash

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.rust_target }}
          rustflags: '' # Avoids potential cross-compilation linking issues in simple setups

      - name: Build Rust Binary (rsil)
        run: |
          cd rsil
          cargo build --release --target ${{ matrix.rust_target }}
        shell: bash

      - name: Prepare Artifacts
        run: |
          mv rsil/target/${{ matrix.rust_target }}/release/rsil${{ matrix.binary_ext }} rsil-${{ matrix.artifact_prefix }}${{ matrix.binary_ext }}
          if [ -f "rsil/target/${{ matrix.rust_target }}/release/${{ matrix.static_lib_name }}" ]; then
            mv rsil/target/${{ matrix.rust_target }}/release/${{ matrix.static_lib_name }} ${{ matrix.static_lib_artifact }}
          fi
        shell: bash

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            sil-${{ matrix.artifact_prefix }}${{ matrix.binary_ext }}
            rsil-${{ matrix.artifact_prefix }}${{ matrix.binary_ext }}
            ${{ matrix.static_lib_artifact }}
